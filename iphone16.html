<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE 24TH — iPhone 16 Preview</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#090a09;color:#eee;font-family:Arial,sans-serif}
body{display:grid;place-items:center;padding:30px;background:
radial-gradient(circle at 50% 35%,rgba(212,174,98,.12),transparent 28%),
#090a09}
.wrap{text-align:center}
.title{font-size:10px;letter-spacing:.4em;color:#d4ae62;margin-bottom:20px}
.phone{
  position:relative;width:393px;height:852px;padding:7px;
  border-radius:52px;
  background:linear-gradient(145deg,#484848,#111,#555);
  box-shadow:0 40px 100px #000,0 0 0 2px #777,0 0 70px rgba(212,174,98,.12);
}
.phone:before{
  content:"";position:absolute;left:-4px;top:150px;width:4px;height:70px;
  background:#333;border-radius:4px 0 0 4px;box-shadow:0 82px 0 #333,0 122px 0 #333
}
.phone:after{
  content:"";position:absolute;right:-4px;top:205px;width:4px;height:110px;
  background:#333;border-radius:0 4px 4px 0
}
.screen{
  width:100%;height:100%;border-radius:46px;overflow:hidden;background:#050605;
  position:relative
}
.screen iframe{width:100%;height:100%;border:0;display:block}
.dynamic-island{
  position:absolute;z-index:20;top:12px;left:50%;transform:translateX(-50%);
  width:125px;height:36px;border-radius:22px;background:#000;
  box-shadow:inset 0 0 0 1px #151515
}
.home{
  position:absolute;z-index:30;bottom:7px;left:50%;transform:translateX(-50%);
  width:135px;height:5px;border-radius:10px;background:#fff;opacity:.85
}
.note{font-size:11px;color:#777;margin-top:18px}
@media(max-width:500px){
 body{padding:10px}.phone{transform:scale(.86);transform-origin:top center;margin-bottom:-110px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">THE 24TH · IPHONE 16 PREVIEW</div>
  <div class="phone">
    <div class="screen">
      <div class="dynamic-island"></div>
      <iframe src="index.html" title="THE 24TH Birthday Website"></iframe>
      <div class="home"></div>
    </div>
  </div>
  <div class="note">393 × 852 px · iPhone 16 viewport</div>
</div>
</body>
</html>
